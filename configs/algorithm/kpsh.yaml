name: KPSH

# H: the slope is FITTED from the cloud and rank-truncated -- derivative-free, the simulator
# stays a black box. This is the default variant.
method:
  _target_: algo.kps.KPSAlgo

  mode: "h"

  # budget = levels * sweeps * num_particles simulator calls (4 * 4 * 128 = 2048)
  num_particles: 128
  levels: 4
  sweeps: 4

  # slope truncation. Measured on NS at N=128: r = 8 / 32 / 64 / 127 gives
  # err 0.730 / 0.658 / 0.752 / 0.822. It regularises the FIT only -- V_t is never truncated.
  rank: 32

  # denoiser evaluations per prior-factor draw. NOT counted in the simulator budget.
  draw_steps: 8

  sigma_max: 80.0
  sigma_min: 0.05
