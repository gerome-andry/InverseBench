name: KPSG

# G: the slope is the simulator's EXACT JACOBIAN, applied implicitly by jvp/vjp. Requires a
# differentiable simulator. Measured 355x better than the fitted slope on inverse scattering
# and 6.8x worse on Navier-Stokes, where no linear map represents the dynamics well and the
# fit's implicit regularisation is what helps -- so pick the variant by problem, not by
# principle.
method:
  _target_: algo.kps.KPSAlgo

  mode: "g"

  # REQUIRES A DIFFERENTIABLE SIMULATOR. The blackhole problem's default noise_type='eht' goes
  # through ehtim (numpy) and cannot be used with this variant -- use kpsh there, or
  # ++problem.model.noise_type=vis_thermal, which is a torch DFT but a different measurement
  # model and therefore a different problem.

  # budget = levels * sweeps * num_particles simulator calls
  # NOTE: G holds the simulator's vjp graph for the whole cloud, so it is far more
  # memory-hungry than H -- it exhausts a 95 GB card at num_particles=64 on inv-scatter.
  num_particles: 16
  levels: 4
  sweeps: 4

  # G's slope is implicit, so there is no low-rank factorisation: the Kalman inverse is taken
  # by GMRES, which assumes neither symmetry nor definiteness. V_t is a Jacobian and a learned
  # denoiser's is non-symmetric by up to 11%, which makes CG diverge outright (relative
  # residual 0.38 -> 1263 over 32 iterations). CG on the normal equations is stable but loses
  # the task. `rank` is unused here.
  #
  # solve_iter MATTERS MORE THAN ANYTHING ELSE. On inv-scatter (N=16, 4 levels, 2 sweeps):
  #     solve_iter    2       4       8      16
  #     psnr        19.33   23.68   27.76   33.97
  # still climbing at 16. The old default of 2 was badly under-solving.
  solve_iter: 16

  draw_steps: 8

  sigma_max: 80.0
  sigma_min: 0.05
