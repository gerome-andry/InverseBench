name: KPSG

# G: the slope is the simulator's EXACT JACOBIAN, applied implicitly by jvp/vjp. Requires a
# differentiable simulator. Measured 355x better than the fitted slope on inverse scattering
# and 6.8x worse on Navier-Stokes, where no linear map represents the dynamics well and the
# fit's implicit regularisation is what helps -- so pick the variant by problem, not by
# principle.
method:
  _target_: algo.kps.KPSAlgo

  mode: "g"

  num_particles: 128
  levels: 4
  sweeps: 4

  # G's slope is implicit, so there is no low-rank factorisation: the Kalman inverse is taken
  # by CG. Each iteration costs a jvp and a vjp through the simulator plus a vjp through the
  # denoiser. `rank` is unused here.
  solve_iter: 2

  # SOLVER. Measured on inv-scatter (N=16, 4 levels, 2 sweeps, one instance):
  #     symmetric_vt=True   solver=cg      DIVERGED at level 2
  #     symmetric_vt=True   solver=gmres   psnr 19.020
  #     symmetric_vt=False  solver=cg      psnr 17.458
  #     symmetric_vt=False  solver=gmres   psnr 19.329
  # GMRES wins in both settings and symmetrising does not help, despite the theory saying it
  # should: V_t is a Jacobian and non-symmetric for a learned denoiser (up to 11%), so
  # symmetrised-CG ought to be the principled choice. The obvious explanation -- an indefinite
  # symmetric part -- was tested and NOT confirmed (spectrum strictly positive on random
  # subspaces). No verified mechanism, only the measurement.
  symmetric_vt: False
  solver: "gmres"
