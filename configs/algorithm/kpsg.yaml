name: KPSG

# G: the slope is the simulator's EXACT JACOBIAN, applied implicitly by jvp/vjp. Requires a
# differentiable simulator. Measured 355x better than the fitted slope on inverse scattering
# and 6.8x worse on Navier-Stokes, where no linear map represents the dynamics well and the
# fit's implicit regularisation is what helps -- so pick the variant by problem, not by
# principle.
method:
  _target_: algo.kps.KPSAlgo

  mode: "g"

  num_particles: 128
  levels: 4
  sweeps: 4

  # G's slope is implicit, so there is no low-rank factorisation: the Kalman inverse is taken
  # by CG. Each iteration costs a jvp and a vjp through the simulator plus a vjp through the
  # denoiser. `rank` is unused here.
  solve_iter: 2

  # GMRES, not CG: V_t built from a LEARNED denoiser is measurably non-symmetric (relative
  # asymmetry of the subspace Gram is up to 11% on the NS prior, worst at the mid levels), and
  # CG assumes symmetry. The conditioning of A is not the reason -- A V_t A^T + s2 I is
  # positive definite however ill-conditioned A is.
  # UNRESOLVED on real data: one NS run gave err 0.989 for gmres vs 0.897 for cg (~2.2 harness
  # sd), and at solve_iter=2 the solve is a preconditioner for a transport step rather than a
  # convergence requirement. Settle it on inv-scatter, paired under run_det.py.
  solver: "gmres" 

  draw_steps: 8

  sigma_max: 80.0
  sigma_min: 0.05
