name: KPSG

# G: the slope is the simulator's EXACT JACOBIAN, applied implicitly by jvp/vjp. Requires a
# differentiable simulator. Measured 355x better than the fitted slope on inverse scattering
# and 6.8x worse on Navier-Stokes, where no linear map represents the dynamics well and the
# fit's implicit regularisation is what helps -- so pick the variant by problem, not by
# principle.
method:
  _target_: algo.kps.KPSAlgo

  mode: "g"

  num_particles: 128
  levels: 4
  sweeps: 4

  # G's slope is implicit, so there is no low-rank factorisation: the Kalman inverse is taken
  # by CG. Each iteration costs a jvp and a vjp through the simulator plus a vjp through the
  # denoiser. `rank` is unused here.
  solve_iter: 2

  # V_t is a Jacobian and a learned denoiser's is not symmetric (relative asymmetry of the
  # subspace Gram up to 11% on the NS prior). The slope is innocent -- A V A^T is symmetric for
  # any A whenever V is -- so the fix belongs at V_t, and applying (V + V^T)/2 implicitly by
  # averaging a vjp and a jvp makes the Kalman operator SPD, so CG is valid. Costs one extra
  # denoiser pass per application; H gets the same correction free in its r x r solve.
  # Set symmetric_vt=False with solver="gmres" for the cheaper one-sided path. Which transports
  # better is unresolved: one NS run gave 0.989 one-sided gmres vs 0.897 one-sided cg.
  symmetric_vt: True
  solver: "cg"

  draw_steps: 8

  sigma_max: 80.0
  sigma_min: 0.05
