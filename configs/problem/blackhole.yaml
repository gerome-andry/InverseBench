name: blackhole
prior: "/mnt/home/gandry/ceph/ibench/ibench_checkpoints/blackhole-50k.pt"
model:
  _target_: inverse_problems.blackhole.BlackHoleImaging
  root: "/mnt/home/gandry/ceph/ibench/ibench_data/blackhole-data/measure"
  # ehtim's default transform is 'nfft', which needs the optional `pynfft` package. ehtim
  # imports it lazily and does NOT fail at import time, so a missing pynfft surfaces only when
  # the forward operator is first called, as
  #     NameError: name 'NFFT' is not defined
  # from ehtim/observing/obs_simulate.py. 'direct' is the exact DFT and needs nothing extra;
  # measured at imsize=64 it costs ~9% over 'fast' (44.6 s vs 40.8 s for a 16x4x2 run), so
  # there is no reason to trade accuracy for it here. 'fast' (FFT gridding) also works.
  ttype: 'direct'
  imsize: 64
  observation_time_ratio: 1.0
  noise_type: 'vis_thermal'
  w1: 0
  w2: 1
  w3: 1
  w4: 0.5
  sigma_noise: 0.0
  unnorm_scale: 0.5
  unnorm_shift: 1.0
 

data:
  _target_: training.dataset.BlackHole
  root: "/mnt/home/gandry/ceph/ibench/ibench_data/blackhole-data/test"
  resolution: 64
  original_resolution: 64
  random_flip: False
  zoom_in_out: False
  id_list: 0-99


evaluator:
  _target_: eval.BlackHoleEvaluator


exp_dir: "/mnt/home/gandry/ceph/ibench/ibench_exp/blackhole"